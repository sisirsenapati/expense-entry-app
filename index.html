<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Entry</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

<div class="container">
    <div class="card">

        <h2>Expense Entry</h2>

        <div class="field">
            <label>Amount</label>
             <div class="input-group">
                 <input type="number" id="amount" placeholder="Enter Amount">
                <button type="button" class="mic-btn" id="amountMic" onclick="startSpeech('amount')" >
                    <span class="material-icons"> mic</span>
            </button>
            </div>            
        </div>

        <div class="field">
            <label>UPI Name</label>
            <div class="input-group">
                <input type="text" id="upiName" placeholder="Enter UPI Name">
                <button type="button" class="mic-btn" id="upiNameMic" onclick="startSpeech('upiName')" >
                    <span class="material-icons"> mic</span>
                </button>
            </div>             
        </div>

        <div class="field">
            <label>Purpose</label>                      
            <div class="input-group">
                <textarea id="purpose" rows="3" placeholder="Enter Purpose"></textarea>
                <button type="button" class="mic-btn" id="purposeMic" onclick="startSpeech('purpose')" >
                    <span class="material-icons"> mic</span>
                </button>
            </div>            
        </div>

        <button id="submitBtn">
            Submit
        </button>
        <div id="loader" class="loader-container">
    <div class="loader"></div>
    <p>Cooling..</p>
    </div>
    </div>

</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
